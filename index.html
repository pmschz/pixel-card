<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pixel Card 💌</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <h1 class="title">PIXEL<br/>CARD</h1>
    <p class="subtitle">type your name and see what your card says to you</p>

    <div class="name-form">
      <input id="nameInput" class="pixel-input" maxlength="18" placeholder="your name" autocomplete="off" />
      <button id="openBtn" class="pixel-btn">OPEN MY CARD</button>
    </div>

    <div id="revealArea" class="layout hidden">
      <div class="form">
        <button id="shuffleBtn" class="pixel-btn small">🔀 ANOTHER MESSAGE</button>

        <label class="label">Icon:</label>
        <div id="iconPicker" class="picker"></div>

        <label class="label">Color:</label>
        <div id="colorPicker" class="picker"></div>
      </div>

      <div class="preview">
        <canvas id="cardCanvas" width="200" height="140"></canvas>
        <button id="downloadBtn" class="pixel-btn">DOWNLOAD CARD</button>
      </div>
    </div>
  </div>

  <script src="card.js"></script>
</body>
</html>
