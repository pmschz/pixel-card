<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Friend Group Wrapped</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="setupScreen" class="screen">
    <h1 class="brand">FRIEND GROUP<br/>WRAPPED</h1>
    <p class="tagline">a Spotify-Wrapped style recap for your squad</p>

    <label class="field-label" for="groupNameInput">Group name</label>
    <input id="groupNameInput" class="field-input" maxlength="24" placeholder="e.g. The Chaos Crew" />

    <label class="field-label" for="friendNameInput">Add your friends</label>
    <div class="chip-input-row">
      <input id="friendNameInput" class="field-input" maxlength="18" placeholder="friend's name" />
      <button id="addFriendBtn" class="add-btn">ADD</button>
    </div>
    <div id="friendChips" class="chips"></div>
    <p id="setupError" class="error hidden">Add at least 2 friends to generate your Wrapped.</p>

    <button id="generateBtn" class="primary-btn">GENERATE WRAPPED ➔</button>
  </div>

  <div id="wrappedScreen" class="screen hidden">
    <div class="phone">
      <div class="progress-row" id="progressRow"></div>
      <button id="exitBtn" class="exit-btn">✕</button>
      <div class="slide-viewport">
        <div id="slideStage" class="slide"></div>
        <div class="tap-zone left" id="tapLeft"></div>
        <div class="tap-zone right" id="tapRight"></div>
      </div>
    </div>
  </div>

  <canvas id="recapCanvas" width="300" height="500" class="hidden"></canvas>

  <script src="app.js"></script>
</body>
</html>
